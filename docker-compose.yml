
services:
  db:
    image: postgres:16
    container_name: eventos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventos_academicos}
      POSTGRES_USER: ${POSTGRES_USER:-eventos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos_app -d eventos_academicos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: eventos_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eventos_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eventos_academicos}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
